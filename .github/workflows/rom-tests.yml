name: ROM smoke tests

on:
  pull_request:
    branches:
      - "main"
      - "[0-9]+.[0-9]+"
  push:
    branches:
      - "main"
      - "[0-9]+.[0-9]+"

jobs:
  rom-tests:
    # Every step below is a make target, so `make -C test-framework check`
    # runs this same job locally, with the same flags, before pushing.
    name: run-roms
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      # The headless harness needs only a C toolchain -- no SDL, no X server.
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      # Warnings-as-errors over harness/ only (the core has pre-existing ones).
      - name: Check harness compiles clean
        run: make -C test-framework strict

      - name: Build headless harness
        run: make -C test-framework

      # The verdict engine and header decoder are pure Python; these run even
      # when the ROM list is empty, so the job still checks something useful.
      - name: Unit tests
        run: make -C test-framework unit-tests

      - name: Run ROM tests
        run: |
          make -C test-framework smoke SMOKE_EXTRA="\
            --json results.json \
            --junit results.xml \
            --github --no-color"

      # blargg's NES test suites and nestest are not stored in this repository
      # (neither carries a licence -- see test-framework/roms/README.md). They
      # are downloaded from a pinned upstream commit and checked against the
      # SHA-256 of every file in testroms.json, so the bytes CI runs are the
      # bytes the baseline was recorded from.
      - name: Cache test ROMs
        uses: actions/cache@v6.1.0
        with:
          path: test-framework/roms/external
          key: testroms-${{ hashFiles('test-framework/testroms.json') }}

      # Unlike the smoke sweep above, these ROMs report their own verdict;
      # `make testroms` carries the flags that reads it (see the Makefile).
      - name: Run test ROMs (blargg + nestest)
        run: |
          make -C test-framework testroms TESTROM_EXTRA="\
            --json testroms-results.json \
            --junit testroms-results.xml \
            --github --no-color"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: rom-test-results
          path: |
            test-framework/results.json
            test-framework/results.xml
            test-framework/testroms-results.json
            test-framework/testroms-results.xml
          if-no-files-found: ignore
